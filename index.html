function useIsMobile() {
  const [mobile, setMobile] = useState(window.innerWidth < 768);
  useEffect(() => {
    const h = () => setMobile(window.innerWidth < 768);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return mobile;
}

function jobLabel(d) {
  if(d.jobCategory==="custom") return d.jobCustom || "Tourism industry (job not entered)";
  var j = JOBS.find(function(x){return x.id===d.jobCategory;});
  if(!j) return "Tourism industry (not selected)";
  var sub = (d.jobSub && d.jobSub!==OTHER) ? (" — " + d.jobSub) : "";
  return j.label + sub;
}
function exFor(d) { return EX[d.jobCategory] || EX.custom; }

// ─────────────────────────── Profile format ───────────────────────────
function fmtLines(txt, prefix){
  var out = [];
  String(txt||"").split("\n").forEach(function(line){ if(line.trim()) out.push((prefix||"- ") + line.trim()); });
  return out;
}

function fmtProfile(d) {
  var L = [];
  L.push("■ Basic information");
  L.push("- Name (as in passport): " + (d.name||"(not entered)"));
  if(d.nameKo) L.push("- Name in Korean (Hangul): " + d.nameKo);
  if(d.nationality) L.push("- Nationality: " + d.nationality);
  if(d.visa) L.push("- Visa status: " + d.visa);
  L.push("- Target field: Tourism industry / " + jobLabel(d) + (d.role?(" ("+d.role+")"):""));
  if(d.birth) L.push("- Date of birth: " + d.birth);
  if(d.phone) L.push("- Phone: " + d.phone);
  if(d.email) L.push("- Email: " + d.email);
  if(d.address) L.push("- City of residence: " + d.address);
  if(d.homepage) L.push("- Website / SNS: " + d.homepage);
  if(d.oneWord) L.push("- Me in one word: " + d.oneWord);
  L.push("");
  L.push("■ Education (one line = one school)");
  var edu = fmtLines(d.education);
  if(edu.length) L = L.concat(edu); else L.push("- (not entered)");
  L.push("");
  L.push("■ Certifications · Languages · Tools");
  var cert = fmtLines(d.certifications);
  if(cert.length) L = L.concat(cert);
  if(d.koreanLevel) L.push("- Korean proficiency: " + d.koreanLevel);
  if(d.languages) L.push("- Other languages (incl. native language): " + d.languages);
  if(d.tools) L.push("- Tools: " + d.tools);
  if(!cert.length && !d.koreanLevel && !d.languages && !d.tools) L.push("- (not entered)");
  L.push("");
  L.push("■ Work & other experience (several — material for the resume's Experience section)");
  var star = d.starIndex;
  d.expList.forEach(function(e, i){
    var has = e.org||e.duty||e.numbers;
    if(!has) return;
    L.push("[Experience " + (i+1) + "]" + (i===star?" ★ KEY EXPERIENCE":""));
    var ty = (e.type===OTHER_TYPE) ? (e.typeCustom || "") : e.type;
    if(ty)       L.push("- Type: " + ty);
    if(e.org)    L.push("- Company / organization / activity: " + e.org);
    if(e.period) L.push("- Period: " + e.period);
    if(e.title)  L.push("- Position / role: " + e.title);
    if(e.duty)   L.push("- Main tasks (what I did): " + e.duty);
    if(e.numbers)L.push("- Numbers (results / scale): " + e.numbers);
    if(e.link)   L.push("- Link to the target job (my own view): " + e.link);
    L.push("");
  });
  L.push("■ Key experience in depth (core episode for the self-introduction)");
  var se = d.expList[star] || {};
  if(se.org) L.push("- Experience: " + se.org + (se.period?(" ("+se.period+")"):""));
  if(d.starSituation) L.push("- [Situation / background] " + d.starSituation);
  if(d.starAction)    L.push("- [Action — what I did and how] " + d.starAction);
  if(d.starResult)    L.push("- [Result — before → after] " + d.starResult);
  L.push("");
  L.push("■ Other activities (material for the resume's 'Other Activities' section)");
  var a1 = fmtLines(d.actTeach,   "- [Training · presentations · programs] ");
  var a2 = fmtLines(d.actAward,   "- [Awards · evaluations · recognition] ");
  var a3 = fmtLines(d.actContent, "- [Writing · content · SNS] ");
  var a4 = fmtLines(d.actEtc,     "- [Volunteering · groups · routines, etc.] ");
  var acts = a1.concat(a2, a3, a4);
  if(acts.length) L = L.concat(acts); else L.push("- (none)");
  L.push("");
  L.push("■ Strengths · values · motivation");
  if(d.expStrengths && d.expStrengths.length) L.push("- Strength keywords: " + d.expStrengths.join(", "));
  if(d.appealPoint) L.push("- My unique appeal point: " + d.appealPoint);
  if(d.motivation) L.push("- Motivation: " + d.motivation);
  if(d.differentiator) L.push("- What makes me different: " + d.differentiator);
  if(d.workValue) L.push("- My work principle: " + d.workValue);
  if(d.aspiration) L.push("- Goal after joining: " + d.aspiration);
  return L.join("\n");
}

/* ── Target company (optional — if entered, all prompts switch to company-tailored mode) ── */
function hasTarget(d){
  return !!((d.targetCompany||"").trim() || (d.targetPosting||"").trim() || (d.targetTalent||"").trim());
}
function fmtTarget(d){
  if(!hasTarget(d)) return "";
  var L = ["[Target company information — entered by the applicant]"];
  if((d.targetCompany||"").trim()) L.push("■ Company : " + d.targetCompany.trim());
  if((d.targetPosting||"").trim()) L.push("■ Job posting (duties · requirements · preferred qualifications, etc.)\n" + d.targetPosting.trim());
  if((d.targetTalent||"").trim())  L.push("■ Ideal candidate · core values · company information\n" + d.targetTalent.trim());
  return L.join("\n") + "\n\n";
}

// ─────────────────────────── 5 prompts ───────────────────────────
function buildPrompts(d) {
  var P = fmtProfile(d);
  var name = d.name || "the applicant";
  var job = jobLabel(d) + (d.role?(" / "+d.role):"");

  var TB = fmtTarget(d);

  // ── Prompt 1 : Resume draft (7-section free-format resume, Korean hiring style) ──
  var p1 = "# Role\n"
    + "You are a resume consultant who has screened and edited resumes for Korea's tourism industry (hotels, airlines, travel agencies, MICE, casinos, food service, public organizations) for 14 years, including many resumes of international students. Your job is to turn a resume that only 'lists periods and titles' into one where 'numbers and the link to the job are visible'.\n\n"
    + "# Goal\n"
    + "Using the [Profile] below, write the full text of every section of a free-format resume for '" + job + "'. The structure follows Korean hiring practice, so the result can later be translated into Korean and submitted to Korean employers. Write it in English.\n\n"
    + "[Profile]\n" + P + "\n\n" + TB
    + EN_STYLE
    + "# Process (keep this order)\n"
    + "STEP 1. Spec analysis table — break down EVERY item in the [Profile]'s experience section into the table below.\n"
    + "  | Experience (organization · role) | Recorded value (counted numbers) | Competency shown | Relevance to '" + job + "' (High/Mid/Low) |\n"

    + "  (3) → one line on what strength this experience gives for '" + job + "' (this line is the heart of a free-format resume. Use the [Profile]'s 'Link to the target job' first, but make it sharper).\n"
    + "STEP 3. Resume top set (3 parts)\n"
    + "  · Headline (1 sentence) — one sentence that covers the whole resume. Include 1 key number + job keywords (density like: \"Trilingual hotel intern who handled 80 check-ins a day for guests from 20+ countries\").\n"
    + "  · Core competencies (3 lines) — ① field of expertise (job keyword + experience) ② key achievement (strongest number) ③ unique strength (one combination others do not have). About 8–12 words each.\n"
    + "  · Self-introduction (about 70–90 words) — a short intro that expands the headline. Flow: 'with this experience → I will do this in this job'. At least 2 numbers, no flowery words.\n"
    + "STEP 4. Remaining sections\n"
    + "  · Education — newest first. If the major connects to the job, add '— (one connecting line)'. Try to connect even an unrelated major as a strength. Korean language programs (language institute, Korean course) are valid education lines.\n"
    + "  · If years, issuing organizations or dates for education/certifications are missing, do NOT invent them — write '(fill in)'.\n"
    + "  · Certifications & Languages — sort by job relevance. Put Korean proficiency (TOPIK / KIIP level) first, then the native language, then other languages. Add '— (what this means on the job)' to 1–2 certifications or languages that directly connect to the job. If no official score exists, write it honestly, e.g., 'Korean: daily conversation (no official score yet)'.\n"

    + "STEP 5. 🔎 Number follow-up questions — up to 3 places where numbers are missing or weak. Do not invent numbers; give a counting method the applicant can do themselves (period × times per week × people per time).\n\n"
    + (hasT ? ("# Company-tailored rules — [Target company information] exists, so apply these\n"
      + "1. Before STEP 1, extract 6–8 key keywords from the posting and ideal-candidate statement, grouped as [Duties / Requirements / Preferred / Ideal candidate], and judge 'relevance' in the spec analysis table by these keywords.\n"
      + "2. Put at least 2 posting keywords into the headline and the 3 core-competency lines, together with the applicant's evidence (numbers, experience).\n"
      + "3. Sort experiences and place ★ by closeness to the posting's duties. Move certifications/experience that match preferred qualifications forward and add one line '— matches a preferred qualification'.\n"
      + TARGET_GUARD + "\n") : "")
    + "# Common rules\n"
    + "1. No empty adjectives or adverbs (hardworking, passionately, actively) — replace them all with numbers, actions and results.\n"
    + "2. Never invent facts or numbers that are not in [Profile]. For estimates, write 'about ~' with the calculation.\n"
    + "3. Each bullet 15 words or fewer. A resume is not read; it is scanned.\n"
    + "4. Do not delete experiences with low relevance — lower their priority and move them to 'Other activities'.\n"
    + "5. Do not use a Western one-page CV style that hides the structure. Keep the section order below so it matches the Korean resume template 1:1.\n\n"
    + "# Output format (exactly in this order — 1:1 with the resume template sections)\n"
    + "(0) STEP 1 spec analysis table → (1) Headline → (2) Basic information (name, name in Korean if entered, nationality, visa status if entered, date of birth, phone, email, city; mark empty items as 'fill in on the template') → (3) 3 core-competency lines → (4) Self-introduction (70–90 words) → (5) Education → (6) Experience incl. ★ → (7) Certifications & Languages → (8) Other activities → (9) 🔎 Number follow-up questions"
    + (hasT ? " → (10) Posting keyword map — | Keyword | Source (Duties/Requirements/Preferred/Ideal candidate) | Where it appears in the resume | Evidence |; mark keywords you could not reflect as 'not enough evidence' and connect them to the STEP 5 number questions" : "");

  // ── Prompt 2 : Self-introduction (Korean-style 4 questions, material allocation) ──
  var p2 = "# Role\n"
    + "You are an expert who has edited self-introductions (Korean 'jagisogaeseo') for Korea's tourism industry for 14 years and has evaluated hundreds of them as a document screener. Your job is to turn an ordinary applicant into 'the one person the interviewer must meet'.\n\n"
    + "# Goal\n"

    + "   · Does NOT cover: motivation or goals again. Do not show the labels 'Situation/Task/Action/Result'.\n"
    + "③ Job Fit & My Strengths (120–150 words)\n"

    + "   · Does NOT cover: the key experience from ② again. Overlap = failed differentiation.\n"

    + (hasT ? ("# Company-tailored rules — [Target company information] exists, so apply these\n"

      + "3. ③ Job Fit maps 1:1 to the posting's requirements and preferred qualifications; ④ Goals is an action plan based on the posting's duties.\n"
      + "4. Use the company name (" + coName + ") instead of 'your company'.\n"
      + TARGET_GUARD + "\n") : "")
    + "# Common rules\n"
    + "1. Start each question with a short impact subtitle (about 5–9 words) that makes people want to read (e.g., \"The intern who cleared a crowded lobby in 5 minutes\"). No clichés.\n"
    + "2. Every question is conclusion-first. The first sentence after the subtitle states the conclusion. Do not start with greetings or flowery words.\n"

    + "- [ ] Is the same experience, number or sentence used as 'main' material in two or more questions?\n"

    + "# Output format\n"

    + (hasT ? " → (5) Ideal-candidate link table — | Ideal-candidate keyword | Question that proves it | Evidence sentence |" : "");

  // ── Prompt 3 : Job portfolio v7 (submission draft + 🔒 insight report + HTML preview) ──
  var p3 = "# Role\n"
    + "You are a recruiter who has handled hiring in Korea's tourism industry for 15 years and a job-portfolio director. If the resume and self-introduction are 'words', the portfolio is 'evidence'. You build an evidence document that makes a recruiter decide within 30 seconds: 'this person is already prepared'.\n"

    + (hasT ? ("# Company-tailored rules — [Target company information] exists, so apply these\n"

    + "\n"
    + "# A. Submission portfolio draft structure (exactly this order and format)\n"
    + "Use only basic Notion blocks (heading, callout, table, divider, inline code) and put a --- divider between sections. At most 1 emoji, only in front of a section title.\n"
    + "\n"
    + "# (Name) | (Key message — one sentence containing the target job and core strength)\n"

    + "## 01 My Assets — My Tools at a Glance\n"

function completion(d) {
  var e0 = d.expList[0] || {};
  var anyNum = d.expList.some(function(e){return e.numbers && e.numbers.trim();});
  var checks = [
    !!d.name, !!d.jobCategory,
    !!(d.education.trim() || d.certifications.trim() || d.koreanLevel.trim()),
    !!(e0.org && e0.duty), anyNum,
    !!d.starAction, !!d.starResult,
    !!d.motivation, !!d.differentiator,
  ];
  var filled = checks.filter(Boolean).length;
  return Math.round(filled/checks.length*100);
}

      <h1 style={{fontWeight:800,fontSize:"clamp(19px,4vw,26px)",letterSpacing:"-0.02em",color:C.ink,margin:"0 0 7px",lineHeight:1.25}}>{title}</h1>
      <p style={{color:C.muted,fontSize:13.5,lineHeight:1.7,margin:0}}>{sub}</p>
    </div>
  );
}
function F({label, hint, req, opt, children}) {
  return (
    <div style={{marginBottom:16}}>
      <label style={{display:"block",marginBottom:6}}>
        <span style={{fontWeight:600,color:C.ink,fontSize:13.5}}>{label}</span>
        {req && <span style={{color:C.accent,marginLeft:3}}>*</span>}
        {opt && <span style={{background:C.borderSoft,color:C.muted,fontSize:10.5,fontWeight:700,padding:"1px 8px",borderRadius:10,marginLeft:6,verticalAlign:"1px"}}>Optional · skip if none</span>}
        {hint && <div style={{color:C.muted,fontSize:11.5,marginTop:3,lineHeight:1.5,fontWeight:400,whiteSpace:"pre-line"}}>{hint}</div>}
      </label>
      {children}
    </div>
  );
}
const IS = {width:"100%",border:"1px solid #E5E5EA",borderRadius:9,padding:"10px 12px",fontSize:13.5,color:"#1D1D1F",background:"#fff",lineHeight:1.6};
function TI({val, set, ph}) { return <input type="text" value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={IS}/>; }
function TA({val, set, ph, rows=3}) { return <textarea value={val} onChange={e=>set(e.target.value)} placeholder={ph} rows={rows} style={IS}/>; }
function Grid2({m, children}) { return <div style={{display:"grid",gridTemplateColumns:m?"1fr":"1fr 1fr",gap:12}}>{children}</div>; }

function Notice({ico, tone, children}) {
  var bg = tone==="warn"?C.warnBg:tone==="good"?C.goodBg:C.accentBg;
  var bd = tone==="warn"?C.warn:tone==="good"?C.good:C.accent;
  return (
    <div style={{background:bg,border:"1px solid "+bd,borderRadius:10,padding:"11px 14px",marginBottom:20,display:"flex",gap:9,alignItems:"flex-start"}}>
      <span style={{fontSize:16,flexShrink:0}}>{ico}</span>
      <div style={{fontSize:12.5,color:C.ink,lineHeight:1.65}}>{children}</div>
    </div>
  );
}

// ─────────────────────────── STEP 1 : Basic info · target job ───────────────────────────
function S1({d, u, m}) {
  var ex = exFor(d);
  // The target-company fields open only for people who choose 'Yes' (otherwise just move on)
  var _co = useState(hasTarget(d)); var hasCo = _co[0]; var setHasCo = _co[1];
  function pickCo(yes){
    if(!yes && hasTarget(d)){
      if(!window.confirm("Delete the company information you entered and build the prompts for the job only?")) return;
      u("targetCompany",""); u("targetPosting",""); u("targetTalent","");
    }
    setHasCo(yes);
  }
  return (
    <>
      <SH eyebrow="STEP 01 · Basic info & target job" time="about 3 min"
        title="Let's start lightly with your basic information"
        sub="Only your name is required. Empty items will show as '(fill in)' in the final document, so write what you remember quickly and move on."/>
      <Notice ico="✍️"><b>Simple English is perfectly fine.</b> Short sentences, small mistakes, or a few words in your own language are OK — the prompts tell the AI to understand your meaning and write polished English. It will never add facts you did not write.</Notice>
      <div style={{fontWeight:800,fontSize:14.5,color:C.ink,marginBottom:12}}>Basic information — resume section 1</div>
      <Grid2 m={m}>
        <F label="Name (as in your passport)" req><TI val={d.name} set={function(v){u("name",v);}} ph="e.g., NGUYEN Van An"/></F>
        <F label="Name in Korean (Hangul)" opt hint="If you already use a Korean spelling of your name (school ID, bank, part-time job), write it. It is used for the Korean version.">
          <TI val={d.nameKo} set={function(v){u("nameKo",v);}} ph="e.g., 응우옌 반 안"/>
        </F>
      </Grid2>
      <Grid2 m={m}>
        <F label="Nationality" opt><TI val={d.nationality} set={function(v){u("nationality",v);}} ph="e.g., Vietnam"/></F>
        <F label="Visa status" opt hint="Korean employers often check this. Write only what is true; leave it blank if you are not sure.">
          <TI val={d.visa} set={function(v){u("visa",v);}} ph="e.g., D-2 (Student), part-time work permit / D-10 (Job seeker)"/>
        </F>
      </Grid2>
      <Grid2 m={m}>
        <F label="Date of birth" opt><TI val={d.birth} set={function(v){u("birth",v);}} ph="e.g., 2001.03.15 (or just 'born in 2001')"/></F>
        <F label="Phone" opt><TI val={d.phone} set={function(v){u("phone",v);}} ph="e.g., 010-0000-0000"/></F>
      </Grid2>
      <Grid2 m={m}>
        <F label="Email" opt><TI val={d.email} set={function(v){u("email",v);}} ph="e.g., abc@gmail.com"/></F>
        <F label="City of residence" opt hint="City and district only (e.g., Seoul, Jung-gu). No detailed address needed.">
          <TI val={d.address} set={function(v){u("address",v);}} ph="e.g., Seoul, Jung-gu"/>
        </F>
      </Grid2>
      <F label="Website · SNS" opt hint="Write it if you have one; if not, just move on. Don't go searching for links now — you can add them later in Word.">
        <TI val={d.homepage} set={function(v){u("homepage",v);}} ph="e.g., Instagram @abc / blog address"/>
      </F>
      <div style={{borderTop:"1px dashed "+C.border,margin:"22px 0 18px"}}/>
      <F label="Which field are you applying to?" req hint="Choose the closest field. Once selected, the examples in all later questions change to match that job.">
        <div style={{display:"grid",gridTemplateColumns:m?"1fr 1fr":"repeat(4,1fr)",gap:8}}>
          {JOBS.map(function(j){
            var on = d.jobCategory===j.id;
            return (
              <button key={j.id} onClick={function(){u("jobCategory",j.id); u("jobSub","");}}
                style={{border:"1.5px solid "+(on?C.ink:C.border),background:on?C.ink:"#fff",color:on?"#fff":C.ink,
                  borderRadius:10,padding:"11px 8px",fontSize:12.5,fontWeight:700,cursor:"pointer",lineHeight:1.3}}>{j.label}</button>
            );
          })}
        </div>
      </F>
      {d.jobCategory==="custom" && (
        <F label="Type your field" req>
          <TI val={d.jobCustom} set={function(v){u("jobCustom",v);}} ph="e.g., Cruise crew / Theme park operation / Tourism start-up"/>
        </F>
      )}
      {d.jobCategory && d.jobCategory!=="custom" && JOB_SUBS[d.jobCategory].length>0 && (
        <F label="Specific job" opt hint="Choose the closest one. If unsure, you can skip it.">
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {JOB_SUBS[d.jobCategory].map(function(s){
              var on = d.jobSub===s;
              return (
                <button key={s} onClick={function(){u("jobSub",on?"":s);}}
                  style={{border:"1.5px solid "+(on?C.accent:C.border),background:on?C.accentBg:"#fff",color:on?C.accent:C.muted,
                    borderRadius:18,padding:"7px 13px",fontSize:12,fontWeight:600,cursor:"pointer"}}>{s}</button>
              );
            })}
          </div>
        </F>
      )}
      <F label="Position / type of hire" opt>
        <TI val={d.role} set={function(v){u("role",v);}} ph={ex.role}/>
      </F>
      <div style={{borderTop:"1px dashed "+C.border,margin:"22px 0 18px"}}/>
      <div style={{border:"1px solid "+C.border,borderRadius:12,padding:"15px 16px",background:C.canvas,marginBottom:hasCo?16:0}}>
        <div style={{fontWeight:800,fontSize:14,color:C.ink,marginBottom:5}}>🏢 Have you already chosen a company? <span style={{color:C.faint,fontWeight:600,fontSize:12}}>(optional)</span></div>
        <p style={{color:C.muted,fontSize:12,lineHeight:1.65,margin:"0 0 12px"}}>
          <b style={{color:C.ink}}>It is completely fine if you haven't.</b> If you leave this empty, your resume, self-introduction and portfolio are completed normally for {d.jobCategory ? ("the '"+jobLabel(d)+"' job") : "the job you selected"}.
          Adding a posting is an <b style={{color:C.ink}}>extra option</b> that tailors the documents to that company. When you have a company later, come back to STEP 1, add it, and copy the prompts again.
        </p>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[{k:false,t:"Not yet → just continue"},{k:true,t:"Yes → enter the posting"}].map(function(o){
            var on = hasCo===o.k;
            return (
              <button key={String(o.k)} onClick={function(){ pickCo(o.k); }}
                style={{border:"1.5px solid "+(on?C.ink:C.border),background:on?C.ink:"#fff",color:on?"#fff":C.ink,
                  borderRadius:9,padding:"10px 14px",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>{on?"✓ ":""}{o.t}</button>
            );
          })}
        </div>
      </div>
      {hasCo && (
        <>
          <Notice ico="💡">Fill in <b>only what you have</b> among the three fields. Only the company name, or only the posting, is enough. The documents work even with empty fields. A posting written in Korean is fine — paste it as it is.</Notice>
          <F label="Company name" opt>
            <TI val={d.targetCompany} set={function(v){u("targetCompany",v);}} ph="e.g., Grand Korea Leisure (GKL) / Lotte Hotel Seoul / Korea Tourism Organization"/>
          </F>
          <F label="Job posting (original text)" opt hint="Copy the 'Duties · Requirements · Preferred qualifications' part of the posting page and paste it all. No need to organize it. Leave empty if the posting is not out yet.">
            <TA val={d.targetPosting} set={function(v){u("targetPosting",v);}} rows={6} ph={"e.g.,\n[Duties] Foreign guest service and reservations, VIP protocol\n[Requirements] Graduate (or expected) in a related major, conversational English\n[Preferred] TOPIK Level 4 or higher, hotel internship experience"}/>
          </F>
          <F label="Ideal candidate · core values · company information" opt hint="Paste the 'ideal candidate' from the careers page and the vision/core values from the company introduction. Leave it empty if hard to find. (The prompts block the AI from inventing company information that is not here.)">
            <TA val={d.targetTalent} set={function(v){u("targetTalent",v);}} rows={4} ph={"e.g.,\nIdeal candidate : A service person who moves guests / An innovator who takes on change\nCore values : Trust · Challenge · Respect"}/>
          </F>
        </>
      )}
    </>
  );
}

// ─────────────────────────── STEP 2 : Education · certifications · languages ───────────────────────────
function S2({d, u, m}) {
  return (
    <>
      <SH eyebrow="STEP 02 · The backbone of your resume" time="about 3 min — don't spend time here"
        title="Write education and certifications — names only, quickly"
        sub="Write years, dates and issuers only if you remember them roughly. Empty ones show as '(fill in)' in the final document, and you can complete them later. Spend your time on the next step (experience)."/>
      <F label="Education" opt hint={"One per line. School / major is enough. Years roughly (e.g., graduating 2026). Korean language programs count too.\nTip: if you know the official Korean name of your school or major, add it in brackets — it makes the Korean version accurate."}>
        <TA rows={4} val={d.education} set={function(v){u("education",v);}}
          ph={"XX University (OO대학교) / Hotel & Tourism Management / graduating 2026\nXX University Korean Language Institute / Level 5 completed / 2022\nXX High School, Hanoi (optional)"}/>
      </F>
      <F label="Certifications · completed courses · awards" opt hint={"One per line. The name alone is enough. Issuer and date only if you remember. Start with ones related to the target job."}>
        <TA rows={4} val={d.certifications} set={function(v){u("certifications",v);}}
          ph={"Tourist Interpretation Guide (Korean national license)\nCS Leaders (customer service) / 2025\nMOS Master / Microsoft"}/>
      </F>
      <Grid2 m={m}>
        <F label="Korean proficiency" opt hint="TOPIK level, KIIP (Social Integration Program) level, or your real level in words. Very important for Korean employers — write it honestly.">
          <TI val={d.koreanLevel} set={function(v){u("koreanLevel",v);}} ph="e.g., TOPIK Level 4 (2025) / daily conversation OK"/>
        </F>
        <F label="Other languages (incl. native)" opt hint="Your native language is a real asset in tourism. Add scores or levels if you have them.">
          <TI val={d.languages} set={function(v){u("languages",v);}} ph="e.g., Vietnamese (native), English TOEIC 850, Chinese HSK 4"/>
        </F>
      </Grid2>
      <F label="Tools you can use" opt hint="Documents, data, design, AI tools, booking systems, etc.">
        <TI val={d.tools} set={function(v){u("tools",v);}} ph="e.g., Excel, PowerPoint, Notion, Canva, ChatGPT·Claude, Opera PMS"/>
      </F>
      <Notice ico="💡">It's okay if you have few certifications or languages. The prompts <b>reorder what you have by job relevance</b> and mark missing years or issuers as '(fill in)'. They never invent what you don't have.</Notice>
    </>
  );
}

// ─────────────────────────── STEP 3 : Experience (multiple) ───────────────────────────
function ExpCard({e, i, d, m, updExp, delExp, canDel}) {
  var ex = exFor(d);
  var isStar = d.starIndex===i;
  return (
    <div style={{border:"1.5px solid "+(isStar?C.accent:C.border),borderRadius:14,padding:m?"14px 13px":"16px 18px",marginBottom:14,background:isStar?"#FBFDFF":"#fff",position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,gap:8,flexWrap:"wrap"}}>
        <div style={{fontWeight:800,fontSize:13.5,color:C.ink}}>Experience {i+1}{isStar && <span style={{color:C.accent,marginLeft:6,fontSize:12}}>★ Key experience</span>}</div>
        {canDel && (
          <button onClick={function(){delExp(i);}}
            style={{border:"1px solid "+C.border,background:"#fff",color:C.muted,borderRadius:7,padding:"4px 10px",fontSize:11.5,fontWeight:600,cursor:"pointer"}}>Delete</button>
        )}
      </div>
      <Grid2 m={m}>
        <F label="Type of experience" opt hint="If nothing fits, choose 'Other (type it)'.">
          <select value={e.type} onChange={function(ev){updExp(i,"type",ev.target.value);}} style={{...IS,height:42}}>
            <option value="">Select</option>
            {EXP_TYPES.map(function(t){return <option key={t} value={t}>{t}</option>;})}
          </select>
        </F>
        <F label="Company · organization · activity" req hint="If there is no clear organization (freelance, personal activity), give the activity a simple name. e.g., 'Freelance Korean-Vietnamese interpreting', 'Personal Korea travel YouTube channel'">
          <TI val={e.org} set={function(v){updExp(i,"org",v);}} ph={ex.org}/>
        </F>
      </Grid2>
      {e.type===OTHER_TYPE && (
        <F label="Type it yourself" opt>
          <TI val={e.typeCustom||""} set={function(v){updExp(i,"typeCustom",v);}} ph="e.g., Freelance interpreting / Personal project / YouTube channel / Start-up preparation"/>
        </F>
      )}
      <Grid2 m={m}>
        <F label="Period" opt hint="Roughly is fine (e.g., 2024 ~ about 1 year).">
          <TI val={e.period} set={function(v){updExp(i,"period",v);}} ph="e.g., 2024.03 ~ 2025.02 (12 months)"/>
        </F>
        <F label="Position · role" opt><TI val={e.title} set={function(v){updExp(i,"title",v);}} ph="e.g., Intern / Team member / Part-timer / Team leader"/></F>
      </Grid2>
      <F label="Main tasks (what you did)" req hint={"Format: task — details (numbers). Any number is good: hours, people, cases, %, points.\ne.g., Floor service — 60 tables a day / Stock check — twice a week, 0 errors / SNS — 3 posts a week"}>
        <TA rows={2} val={e.duty} set={function(v){updExp(i,"duty",v);}} ph={ex.duty}/>
      </F>
      <F label="Numbers — results and scale" opt hint={"Hints: XX hours / XX people / XX cases / XX% / XX points / XX won — every number you remember. If not exact, just write the ingredients like '3 times a week × 6 months' — the AI will calculate."}>
        <TA rows={2} val={e.numbers} set={function(v){updExp(i,"numbers",v);}} ph={ex.numbers}/>
      </F>
      <F label="Why this experience is a strength for the target job" opt hint="One line is enough. If empty, the AI will make the link for you.">
        <TI val={e.link} set={function(v){updExp(i,"link",v);}} ph="e.g., Serving foreign guests → directly useful for global guest service"/>
      </F>
    </div>
  );
}

function S3({d, u, m, updExp, addExp, delExp}) {
  var ex = exFor(d);
  return (
    <>
      <SH eyebrow="STEP 03 · Experience — the heart of your resume" time="10–15 min — spend your time here"
        title="Organize 'several' experiences with numbers"
        sub="This fills the resume's '5. Experience ★' section. Work, internships, part-time jobs, clubs, contests, personal activities — anything counts. We recommend 2 or more. Only the organization and main tasks are required; fill the rest as much as you know."/>
      {d.expList.map(function(e,i){
        return <ExpCard key={i} e={e} i={i} d={d} m={m} updExp={updExp} delExp={delExp} canDel={d.expList.length>1}/>;
      })}
      {d.expList.length<6 && (
        <button onClick={addExp}
          style={{width:"100%",border:"1.5px dashed "+C.accent,background:C.accentBg,color:C.accent,borderRadius:12,padding:"13px",fontSize:13.5,fontWeight:800,cursor:"pointer",marginBottom:22}}>
          + Add experience ({d.expList.length}/6)
        </button>
      )}
      <div style={{borderTop:"1px dashed "+C.border,margin:"6px 0 18px"}}/>
      <div style={{fontWeight:800,fontSize:14.5,color:C.ink,marginBottom:4}}>Key experience in depth — build your 'episode pillar'</div>
      <p style={{color:C.muted,fontSize:12,lineHeight:1.6,margin:"0 0 14px"}}>From the experiences above, choose <b>the one episode you remember best</b> and write it in depth. This episode pillar is used in the self-introduction's 'Key Experience' question, and you can reuse it in interviews and your portfolio.</p>
      <F label="Choose your key experience" req>
        <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
          {d.expList.map(function(e,i){
            var on = d.starIndex===i;
            var lb = e.org ? ((i+1)+". "+(e.org.length>22?e.org.slice(0,22)+"…":e.org)) : ("Experience "+(i+1));
            return (
              <button key={i} onClick={function(){u("starIndex",i);}}
                style={{border:"1.5px solid "+(on?C.accent:C.border),background:on?C.accent:"#fff",color:on?"#fff":C.muted,
                  borderRadius:18,padding:"8px 14px",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>{on?"★ ":""}{lb}</button>
            );
          })}
        </div>
      </F>
      <F label="Situation · background — what was the scene?" req hint={"Think of one of these → ① a situation with a problem or inconvenience ② a very busy or difficult day ③ a guest or teammate you remember ④ something you wanted to change"}>
        <TA rows={2} val={d.starSituation} set={function(v){u("starSituation",v);}} ph={ex.situation}/>
      </F>
      <F label="Action — what did you do, and how?" req hint={"It's easy if you split it into ①②③. e.g., ① I checked why the line got long → ② made a guide sheet and checklist → ③ guided waiting guests first. Write what YOU did, not 'the team'."}>
        <TA rows={3} val={d.starAction} set={function(v){u("starAction",v);}} ph={ex.action}/>
      </F>
      <F label="Result — what changed because of your action?" req hint={"Number hints: XX% up/down / XX points (satisfaction 4.8) / S grade / XX won saved / XX minutes shorter. No numbers? Reactions and recognition are good results too — compliment cards, being hired again, an award, praise from the manager."}>
        <TA rows={2} val={d.starResult} set={function(v){u("starResult",v);}} ph={ex.result}/>
      </F>
    </>
  );
}

// ─────────────────────────── STEP 4 : Activities · strengths · values ───────────────────────────
function S4({d, u, m}) {
  var ex = exFor(d);
  function toggleStrength(s){
    var cur = d.expStrengths || [];
    if(cur.indexOf(s)>=0) u("expStrengths", cur.filter(function(x){return x!==s;}));
    else if(cur.length<5) u("expStrengths", cur.concat([s]));
  }
  return (
    <>
      <SH eyebrow="STEP 04 · Activities · strengths · values" time="5–10 min"
        title="Material for 'Other Activities' and your self-introduction"
        sub="The resume's '7. Other Activities' section and your self-introduction's motivation, differentiation and goals come from here. Only strengths, motivation and differentiation are required."/>
      <div style={{fontWeight:800,fontSize:14.5,color:C.ink,marginBottom:4}}>Other activities <span style={{background:C.borderSoft,color:C.muted,fontSize:10.5,fontWeight:700,padding:"1px 8px",borderRadius:10,marginLeft:4,verticalAlign:"2px"}}>Fill only what applies</span></div>
      <p style={{color:C.muted,fontSize:12,lineHeight:1.6,margin:"0 0 14px"}}>You do <b>not</b> need to fill all of these. Write only what you have, one per line, and skip a box completely if it doesn't apply. Add numbers (times, people, period) if you can.</p>
      <Grid2 m={m}>
        <F label="Training · presentations · programs" opt hint="Both ones you led and ones you completed.">
          <TA rows={3} val={d.actTeach} set={function(v){u("actTeach",v);}} ph={"Job-readiness program for international students, completed (2026)\nPresented at a tourism club 3 times"}/>
        </F>
        <F label="Awards · evaluations · recognition" opt>
          <TA rows={3} val={d.actAward} set={function(v){u("actAward",v);}} ph={"Regional tourism idea contest, award (2025)\nBest Service Staff of the Month, 1 time"}/>
        </F>
      </Grid2>
      <Grid2 m={m}>
        <F label="Writing · content · SNS" opt>
          <TA rows={3} val={d.actContent} set={function(v){u("actContent",v);}} ph={"Korea travel blog in Vietnamese (80 posts)\nInstagram travel account, 1,200 followers"}/>
        </F>
        <F label="Volunteering · groups · routines · other" opt>
          <TA rows={3} val={d.actEtc} set={function(v){u("actEtc",v);}} ph={"Interpreting volunteer at a tourist information center, 12 times\nKorean speaking study group, every day for 6 months"}/>
        </F>
      </Grid2>
      <div style={{borderTop:"1px dashed "+C.border,margin:"8px 0 18px"}}/>
      <F label="Your strength keywords (up to 5)" req hint="Choose the strengths that run through your experiences.">
        {STRENGTH_GROUPS.map(function(grp){
          return (
            <div key={grp.g} style={{marginBottom:9}}>
              <div style={{fontSize:11,fontWeight:700,color:C.faint,marginBottom:5}}>{grp.g}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {grp.items.map(function(s){
                  var on = (d.expStrengths||[]).indexOf(s)>=0;
                  return (
                    <button key={s} onClick={function(){toggleStrength(s);}}
                      style={{border:"1.5px solid "+(on?C.accent:C.border),background:on?C.accentBg:"#fff",color:on?C.accent:C.muted,
                        borderRadius:16,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>{s}</button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </F>
      <F label="Your unique appeal point" opt hint="One thing about you that the keywords can't hold. Skip it if nothing comes to mind.">
        <TA rows={2} val={d.appealPoint} set={function(v){u("appealPoint",v);}} ph={ex.diff}/>
      </F>
      <div style={{borderTop:"1px dashed "+C.border,margin:"8px 0 18px"}}/>
      <F label="Motivation — why this work?" req hint="For international students, a short link between you, Korea and this job is powerful. One or two sentences are enough.">
        <TA rows={3} val={d.motivation} set={function(v){u("motivation",v);}} ph={ex.motivation}/>
      </F>
      <F label="What makes you different — one thing" req>
        <TA rows={2} val={d.differentiator} set={function(v){u("differentiator",v);}} ph={ex.diff}/>
      </F>
      <Grid2 m={m}>
        <F label="Your work principle" opt>
          <TA rows={2} val={d.workValue} set={function(v){u("workValue",v);}} ph={ex.value}/>
        </F>
        <F label="What you want to do after joining" opt>
          <TA rows={2} val={d.aspiration} set={function(v){u("aspiration",v);}} ph={ex.aspire}/>
        </F>
      </Grid2>
      <F label="You in one word" opt>

function S5({d, u, copied, onCopy, onReset}) {

// Copy helper — Clipboard API first, then a fallback for file:// pages or older browsers
function copyText(text){
  function fallback(){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.top="-1000px";
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(function(){return true;}, function(){return fallback();});
  }
  return Promise.resolve(fallback());
}

// ─────────────────────────── App ───────────────────────────
function App() {
  var _s = useState(1); var step = _s[0]; var setStep = _s[1];
  var _d = useState(INIT); var data = _d[0]; var setData = _d[1];
  var _c = useState(null); var copied = _c[0]; var setCopied = _c[1];
  var isMobile = useIsMobile();

  var upd = useCallback(function(key, val){ setData(function(p){ var n={...p}; n[key]=val; return n; }); },[]);
  var updExp = useCallback(function(i, key, val){
    setData(function(p){
      var list = p.expList.map(function(e,idx){ return idx===i ? {...e, [key]:val} : e; });
      return {...p, expList:list};
    });
  },[]);
  var addExp = useCallback(function(){
    setData(function(p){ return p.expList.length>=6 ? p : {...p, expList:p.expList.concat([newExp()])}; });
  },[]);
  var delExp = useCallback(function(i){
    setData(function(p){
      if(p.expList.length<=1) return p;
      var list = p.expList.filter(function(_,idx){return idx!==i;});
      var star = p.starIndex;
      if(star===i) star = 0;
      else if(star>i) star = star-1;
      return {...p, expList:list, starIndex:star};
    });
  },[]);
  var reset = useCallback(function(){
    if(window.confirm("All inputs will be cleared. Start over from the beginning?")){
      setData({...INIT, expList:[newExp()]});
      setCopied(null); setStep(1);
    }
  },[]);

  useEffect(function(){ window.scrollTo({top:0,behavior:"smooth"}); },[step]);
  function copyPrompt(text,id){
    copyText(text).then(function(ok){
      if(ok){ setCopied(id); setTimeout(function(){setCopied(null);},2200); }
      else { window.alert("Copy failed in this browser. Click inside the prompt box, press Ctrl+A (Cmd+A on Mac) and Ctrl+C to copy it."); }
    });

                <div>
                  <div style={{fontWeight:600,fontSize:12.5,lineHeight:1.3}}>{s.label}</div>
                  <div style={{fontSize:10.5,opacity:0.6,marginTop:2,lineHeight:1.3}}>{s.sub}</div>
                </div>
              </button>
            </li>
          );
        })}
      </ol>
    </aside>
  );

  var MobileStepBar = (
    <div style={{background:C.panel,borderBottom:"1px solid "+C.border,padding:"10px 0 0"}}>
      <div className="step-scroll" style={{padding:"0 16px 10px",display:"flex",gap:7}}>
        {STEPS.map(function(s){
          var active=s.id===step, done=s.id<step;
          return (
            <button key={s.id} onClick={function(){setStep(s.id);}}
              style={{flexShrink:0,display:"flex",alignItems:"center",gap:5,border:"none",borderRadius:20,padding:"6px 13px",cursor:"pointer",
                background:active?C.ink:done?C.accentBg:C.borderSoft,color:active?"#fff":done?C.accent:C.muted,
                fontSize:11.5,fontWeight:700,whiteSpace:"nowrap",boxShadow:active?"0 2px 8px rgba(0,0,0,0.15)":"none"}}>
              <span style={{width:18,height:18,borderRadius:"50%",background:active?"rgba(255,255,255,0.2)":done?C.accent:"rgba(0,0,0,0.08)",color:active?"#fff":done?"#fff":C.muted,
                display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:900,flexShrink:0}}>{done?"✓":s.id}</span>
              {s.label}
            </button>
          );
        })}
      </div>
      <div style={{height:3,background:C.borderSoft}}><div style={{width:pct+"%",height:"100%",background:C.accent,transition:"width 0.4s ease"}}/></div>
    </div>
  );

  return (
    <div style={{background:C.canvas,minHeight:"100vh",color:C.ink}}>
      <header style={{borderBottom:"1px solid "+C.border,background:C.panel,position:"sticky",top:0,zIndex:50}}>
        <div style={{maxWidth:1100,margin:"0 auto",padding:isMobile?"11px 16px":"13px 22px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
            <div style={{background:C.ink,width:34,height:34,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>✨</div>
            <div style={{minWidth:0}}>
              <div style={{fontWeight:800,fontSize:isMobile?13:14.5,letterSpacing:"-0.01em",lineHeight:1.2}}>Resume · Self-Intro · Portfolio Prompt Maker</div>
              {!isMobile && <div style={{color:C.muted,fontSize:11,marginTop:1}}>For international students in Korea — answer the questions, get English documents, then a Korean version</div>}
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
            <span style={{color:C.accent,fontWeight:800,fontSize:13}}>{step}</span>
            <span style={{color:C.faint,fontSize:12}}>/ {STEPS.length}</span>
            <span style={{color:C.muted,fontSize:11,marginLeft:4,display:isMobile?"none":"inline"}}>{STEPS[step-1].label}</span>
          </div>
        </div>
        {!isMobile && <div style={{height:3,background:C.borderSoft}}><div style={{width:pct+"%",height:"100%",background:C.accent,transition:"width 0.4s ease"}}/></div>}
      </header>

      {isMobile && MobileStepBar}

      <div style={{maxWidth:1100,margin:"0 auto",padding:isMobile?"16px 12px":"26px 22px",display:isMobile?"block":"flex",gap:24,alignItems:"flex-start"}}>
        {!isMobile && Sidebar}
        <main style={{flex:1,minWidth:0}}>
          <div style={{background:C.panel,border:"1px solid "+C.border,borderRadius:isMobile?14:18,padding:isMobile?"20px 16px":34}}>
            {step===1 && <S1 d={data} u={upd} m={isMobile}/>}
            {step===2 && <S2 d={data} u={upd} m={isMobile}/>}
            {step===3 && <S3 d={data} u={upd} m={isMobile} updExp={updExp} addExp={addExp} delExp={delExp}/>}
            {step===4 && <S4 d={data} u={upd} m={isMobile}/>}
            {step===5 && <S5 d={data} u={upd} copied={copied} onCopy={copyPrompt} onReset={reset}/>}
            <div style={{borderTop:"1px solid "+C.border,marginTop:28,paddingTop:16,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <button onClick={function(){setStep(function(s){return Math.max(1,s-1);});}} disabled={step===1}

              <span style={{color:C.faint,fontSize:12}}>{step} / {STEPS.length}</span>
              {step<STEPS.length
                ? <button onClick={function(){setStep(function(s){return Math.min(STEPS.length,s+1);});}}
                    style={{background:C.ink,color:"#fff",border:"none",borderRadius:8,padding:isMobile?"10px 18px":"9px 20px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Next →</button>
                : <span style={{fontSize:12.5,color:C.good,fontWeight:700}}>✨ Done!</span>}
            </div>
          </div>
          <footer style={{textAlign:"center",padding:"22px 0 30px",color:C.faint,fontSize:11.5,lineHeight:1.7}}>
            Yosep AI Document Lab (요셉쌤 AI문서연구소) · Resume · Self-Intro · Portfolio Prompt Maker — English Edition<br/>
            Contact : <a href={KAKAO} target="_blank" rel="noopener" style={{color:C.accent,fontWeight:600,textDecoration:"none"}}>KakaoTalk Open Chat</a>
            <span style={{margin:"0 6px",color:C.faint}}>｜</span>
            <a href="https://hongyosep-profile.vercel.app/" target="_blank" rel="noopener" style={{color:C.accent,fontWeight:600,textDecoration:"none"}}>Instructor Yosep Hong — Official Website</a>
          </footer>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
